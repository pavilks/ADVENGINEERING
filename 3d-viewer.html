<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Model Viewer - ADV Engineering</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0b0f17; /* Saskan ar modālā loga fonu */
            width: 100vw;
            height: 100vh;
            overflow: hidden; /* Novērš jebkādas ritjoslas parādīšanos */
        }
        
        model-viewer {
            width: 100%;
            height: 100%;
            outline: none;
        }

        /* Dubulta drošība: pilnībā paslēpj AR pogu (kubu), ja pārlūks to mēģina uzspiest */
        model-viewer::part(default-ar-button) {
            display: none !important;
        }
    </style>
</head>
<body>

    <!-- Tikai model-viewer, izņemts 'ar' atribūts -->
    <model-viewer id="viewer" src="" auto-rotate camera-controls shadow-intensity="1.5"></model-viewer>

    <script>
        // Nolasām tikai 3D modeļa URL no saites parametriem
        const urlParams = new URLSearchParams(window.location.search);
        const modelUrl = urlParams.get('model');

        if (modelUrl) {
            document.getElementById('viewer').src = modelUrl;
        }
    </script>
</body>
</html>
